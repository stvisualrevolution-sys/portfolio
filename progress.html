  :root {
    --ground:      #F4F6F8;
    --ground-sub:  #E9EDF1;
    --ink:         #0F1620;
    --ink-soft:    #3C4654;
    --slate:       #63707F;
    --rule:        #C9D2DB;
    --rule-soft:   #DDE4EA;
    --cobalt:      #1A46C8;
    --cobalt-soft: #E4EAFA;
    --fluor:       #7A9410;
    --amber:       #A56A00;

    --f-display: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Songti SC", serif;
    --f-body:    "Hiragino Sans", "Yu Gothic", "YuGothic", system-ui, -apple-system, sans-serif;
    --f-data:    ui-monospace, "SF Mono", "Menlo", "Consolas", monospace;

    --s1: .25rem;  --s2: .5rem;   --s3: .75rem;  --s4: 1rem;
    --s5: 1.5rem;  --s6: 2.25rem; --s7: 3.5rem;  --s8: 5.5rem;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ground:      #0C1219;
      --ground-sub:  #131C26;
      --ink:         #E7EDF3;
      --ink-soft:    #B4C0CD;
      --slate:       #8593A2;
      --rule:        #27333F;
      --rule-soft:   #1B242E;
      --cobalt:      #7D9CFF;
      --cobalt-soft: #16233F;
      --fluor:       #B9D93F;
      --amber:       #D9A03C;
    }
  }

  :root[data-theme="dark"] {
    --ground:      #0C1219;
    --ground-sub:  #131C26;
    --ink:         #E7EDF3;
    --ink-soft:    #B4C0CD;
    --slate:       #8593A2;
    --rule:        #27333F;
    --rule-soft:   #1B242E;
    --cobalt:      #7D9CFF;
    --cobalt-soft: #16233F;
    --fluor:       #B9D93F;
    --amber:       #D9A03C;
  }

  :root[data-theme="light"] {
    --ground:      #F4F6F8;
    --ground-sub:  #E9EDF1;
    --ink:         #0F1620;
    --ink-soft:    #3C4654;
    --slate:       #63707F;
    --rule:        #C9D2DB;
    --rule-soft:   #DDE4EA;
    --cobalt:      #1A46C8;
    --cobalt-soft: #E4EAFA;
    --fluor:       #7A9410;
    --amber:       #A56A00;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--f-body);
    font-size: 16px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 68rem;
    margin: 0 auto;
    padding: var(--s6) var(--s5) var(--s8);
  }

  /* ── マストヘッド ─────────────────────────── */

  .topline {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--s4);
  }

  .eyebrow {
    font-family: var(--f-data);
    font-size: .72rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--cobalt);
    margin: 0;
  }

  .top-actions { display: flex; gap: var(--s3); flex-shrink: 0; }

  .theme-toggle, .back-link {
    background: var(--ground);
    border: 1px solid var(--rule);
    color: var(--ink-soft);
    font-family: var(--f-data);
    font-size: .68rem;
    letter-spacing: .1em;
    padding: .4rem .7rem;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    transition: border-color .15s, color .15s;
  }
  .theme-toggle:hover, .back-link:hover { border-color: var(--cobalt); color: var(--cobalt); }
  .theme-toggle:focus-visible, .back-link:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; }

  h1 {
    font-family: var(--f-display);
    font-weight: 600;
    font-size: clamp(1.9rem, 5vw, 2.9rem);
    letter-spacing: .04em;
    line-height: 1.15;
    margin: var(--s4) 0 var(--s3);
    text-wrap: balance;
  }

  .lede {
    max-width: 44rem;
    margin: 0 0 var(--s5);
    color: var(--ink-soft);
    font-size: .95rem;
  }

  /* ── 凡例 ─────────────────────────────────── */

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: var(--s4) var(--s5);
    padding: var(--s3) 0;
    border-top: 2px solid var(--ink);
    border-bottom: 1px solid var(--rule);
    font-size: .74rem;
    color: var(--slate);
  }
  .legend-item { display: inline-flex; align-items: center; gap: var(--s2); }
  .swatch { width: 1.4em; height: .55em; flex-shrink: 0; }
  .swatch.live { background: var(--fluor); }
  .swatch.dev  { background: var(--cobalt); }
  .swatch.fin  { background: var(--slate); }
  .swatch.idle { background: var(--rule); }
  .swatch.idea { background: transparent; border: 1px dashed var(--slate); }

  /* ── フィルタ ─────────────────────────────── */

  .filters {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--s2);
    padding: var(--s4) 0;
    position: sticky;
    top: 0;
    background: var(--ground);
    z-index: 5;
    border-bottom: 1px solid var(--rule-soft);
  }
  .filters-label {
    font-family: var(--f-data);
    font-size: .68rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--slate);
    margin-right: var(--s2);
  }
  .chip {
    background: none;
    border: 1px solid var(--rule);
    color: var(--ink-soft);
    font-size: .78rem;
    padding: .25rem .75rem;
    cursor: pointer;
    transition: border-color .15s, color .15s, background .15s;
  }
  .chip:hover { border-color: var(--cobalt); color: var(--cobalt); }
  .chip:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; }
  .chip[aria-pressed="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--ground);
  }

  /* ── ガント本体 ───────────────────────────── */

  .gantt { margin-top: var(--s5); }

  /* 月軸 */
  .axis {
    display: grid;
    grid-template-columns: minmax(11rem, 16rem) 1fr;
    position: sticky;
    top: 3.3rem;
    background: var(--ground);
    z-index: 4;
    border-bottom: 2px solid var(--ink);
  }
  .axis-label {
    font-family: var(--f-data);
    font-size: .68rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--slate);
    padding: var(--s2) 0;
  }
  .axis-months { display: flex; }
  .axis-months span {
    flex: 1;
    font-family: var(--f-data);
    font-size: .68rem;
    color: var(--slate);
    padding: var(--s2) 0 var(--s2) var(--s2);
    border-left: 1px solid var(--rule-soft);
    white-space: nowrap;
    overflow: hidden;
  }

  .row { border-bottom: 1px solid var(--rule-soft); }
  .row[hidden] { display: none; }

  .row-head {
    display: grid;
    grid-template-columns: minmax(11rem, 16rem) 1fr;
    width: 100%;
    background: none;
    border: 0;
    padding: 0;
    text-align: left;
    color: inherit;
    cursor: pointer;
    font: inherit;
  }
  .row-head:hover .p-name { color: var(--cobalt); }
  .row-head:focus-visible { outline: 2px solid var(--cobalt); outline-offset: -2px; }

  .p-cell {
    padding: var(--s3) var(--s3) var(--s3) 0;
    display: flex;
    align-items: baseline;
    gap: var(--s2);
    min-width: 0;
  }
  .p-caret {
    font-family: var(--f-data);
    font-size: .7rem;
    color: var(--slate);
    flex-shrink: 0;
    transition: transform .15s;
  }
  .row.open .p-caret { transform: rotate(90deg); }
  .p-name {
    font-size: .88rem;
    font-weight: 600;
    line-height: 1.45;
    transition: color .15s;
    overflow-wrap: anywhere;
  }
  .p-cat {
    font-family: var(--f-data);
    font-size: .62rem;
    color: var(--slate);
    border: 1px solid var(--rule);
    padding: 0 var(--s1);
    flex-shrink: 0;
    white-space: nowrap;
  }

  .track {
    position: relative;
    background-image: linear-gradient(to right, var(--rule-soft) 1px, transparent 1px);
    background-size: calc(100% / var(--months)) 100%;
  }
  .bar {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    height: .55rem;
    min-width: .55rem;
  }
  .bar.live { background: var(--fluor); }
  .bar.dev  { background: var(--cobalt); }
  .bar.fin  { background: var(--slate); }
  .bar.idle { background: var(--rule); }
  .bar.idea { background: transparent; border: 1px dashed var(--slate); }

  .bar-label {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-family: var(--f-data);
    font-size: .62rem;
    color: var(--slate);
    white-space: nowrap;
    padding-left: var(--s2);
  }

  /* ── 詳細パネル ───────────────────────────── */

  .detail {
    display: none;
    padding: var(--s2) 0 var(--s5);
  }
  .row.open .detail { display: block; }

  .detail-inner {
    border-left: 2px solid var(--cobalt);
    padding: var(--s3) var(--s4);
    background: var(--ground-sub);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--s4) var(--s5);
  }
  .detail h3 {
    font-family: var(--f-data);
    font-size: .68rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--slate);
    margin: 0 0 var(--s2);
    font-weight: 400;
  }
  .detail ul {
    margin: 0;
    padding: 0;
    list-style: none;
    font-size: .84rem;
    line-height: 1.7;
  }
  .detail li { padding-left: 1.5em; position: relative; margin-bottom: var(--s1); }
  .detail .done li::before { content: "✓"; position: absolute; left: 0; color: var(--fluor); font-weight: 700; }
  .detail .next li::before { content: "□"; position: absolute; left: 0; color: var(--cobalt); }
  .detail .empty { color: var(--slate); font-size: .8rem; }

  .detail-meta {
    grid-column: 1 / -1;
    font-family: var(--f-data);
    font-size: .7rem;
    color: var(--slate);
    display: flex;
    flex-wrap: wrap;
    gap: var(--s2) var(--s4);
    border-top: 1px solid var(--rule);
    padding-top: var(--s2);
  }

  .p-ext {
    font-family: var(--f-data);
    font-size: .7rem;
    color: var(--cobalt);
    flex-shrink: 0;
  }

  .detail-links {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    gap: var(--s2) var(--s4);
  }
  .detail-links a {
    font-family: var(--f-data);
    font-size: .74rem;
    letter-spacing: .03em;
    color: var(--cobalt);
    text-decoration: none;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 1px;
    transition: border-color .15s;
  }
  .detail-links a:hover { border-color: var(--cobalt); }
  .detail-links a:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; }

  /* ── 注記 ─────────────────────────────────── */

  .note {
    margin-top: var(--s7);
    padding-top: var(--s4);
    border-top: 2px solid var(--ink);
    font-size: .82rem;
    color: var(--slate);
    max-width: 44rem;
  }
  .note p { margin: 0 0 var(--s2); }

  /* ── モバイル ─────────────────────────────── */

  @media (max-width: 640px) {
    .wrap { padding: var(--s5) var(--s4) var(--s7); }
    .axis, .row-head { grid-template-columns: minmax(8.5rem, 10rem) 1fr; }
    .p-cat { display: none; }
    .p-name { font-size: .8rem; }
    .bar-label { display: none; }
    .detail-inner { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>

var STATUS_LABEL = { live: "運用中", dev: "開発中", fin: "完成", idle: "休止中", idea: "構想段階" };
var CAT_LABEL = { med: "医療・臨床", game: "ゲーム", tool: "アプリ・ツール", hw: "ハードウェア", web: "Web・文書" };

/* ── 時間軸の計算 ── */
function ym(s) { var p = s.split("-"); return parseInt(p[0], 10) * 12 + (parseInt(p[1], 10) - 1); }
function monthPos(dateStr) {
  // 月内の日割り位置 (0..1) を加える
  var p = dateStr.split("-");
  var m = ym(dateStr);
  var day = p.length > 2 ? parseInt(p[2], 10) : 1;
  return m + Math.min((day - 1) / 30, 1);
}

var minM = Infinity, maxM = -Infinity;
DATA.forEach(function (d) {
  minM = Math.min(minM, ym(d.start));
  maxM = Math.max(maxM, ym(d.last));
});
maxM += 1; // 最終月を月末まで描く
var span = maxM - minM;

/* ── 月軸の描画 ── */
var axis = document.getElementById("axisMonths");
for (var m = minM; m < maxM; m++) {
  var s = document.createElement("span");
  var year = Math.floor(m / 12), mon = (m % 12) + 1;
  s.textContent = (mon === 1 || m === minM) ? year + "." + mon : mon + "月";
  axis.appendChild(s);
}

/* ── 行の描画 ── */
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
}

var rowsHost = document.getElementById("rows");
DATA.slice().sort(function (a, b) { return a.start < b.start ? -1 : a.start > b.start ? 1 : 0; })
.forEach(function (d) {
  var row = el("div", "row");
  row.dataset.cat = d.cat;

  var head = el("button", "row-head");
  head.type = "button";
  head.setAttribute("aria-expanded", "false");

  var cell = el("div", "p-cell");
  cell.appendChild(el("span", "p-caret", "▸"));
  cell.appendChild(el("span", "p-name", d.name));
  if (d.links && d.links.length) cell.appendChild(el("span", "p-ext", "↗"));
  cell.appendChild(el("span", "p-cat", CAT_LABEL[d.cat]));
  head.appendChild(cell);

  var track = el("div", "track");
  track.style.setProperty("--months", span);
  var left = ((ym(d.start) - minM) / span) * 100;
  var width = Math.max(((monthPos(d.last) - ym(d.start)) / span) * 100, 1.2);
  var bar = el("div", "bar " + d.status);
  bar.style.left = left + "%";
  bar.style.width = width + "%";
  track.appendChild(bar);

  var label = el("span", "bar-label", STATUS_LABEL[d.status]);
  if (left + width < 72) {
    label.style.left = (left + width) + "%";
  } else {
    label.style.left = "auto";
    label.style.right = (100 - left) + "%";
    label.style.paddingLeft = "0";
    label.style.paddingRight = ".5rem";
  }
  track.appendChild(label);
  head.appendChild(track);
  row.appendChild(head);

  var detail = el("div", "detail");
  var inner = el("div", "detail-inner");

  var doneBox = el("div", "done");
  doneBox.appendChild(el("h3", null, "✓ ここまでできている"));
  if (d.done.length) {
    var ulD = el("ul", null);
    d.done.forEach(function (t) { ulD.appendChild(el("li", null, t)); });
    doneBox.appendChild(ulD);
  } else {
    doneBox.appendChild(el("p", "empty", "まだ着手していません"));
  }
  inner.appendChild(doneBox);

  var nextBox = el("div", "next");
  nextBox.appendChild(el("h3", null, "□ 次にやること"));
  if (d.next.length) {
    var ulN = el("ul", null);
    d.next.forEach(function (t) { ulN.appendChild(el("li", null, t)); });
    nextBox.appendChild(ulN);
  } else {
    nextBox.appendChild(el("p", "empty", d.status === "idea" ? "計画づくりから" : "当面の残タスクなし"));
  }
  inner.appendChild(nextBox);

  if (d.links && d.links.length) {
    var linkBox = el("div", "detail-links");
    d.links.forEach(function (L) {
      var a = el("a", null, L.t + " ↗");
      a.href = L.h;
      if (L.h.indexOf("http") === 0) { a.target = "_blank"; a.rel = "noopener"; }
      linkBox.appendChild(a);
    });
    inner.appendChild(linkBox);
  }

  var meta = el("div", "detail-meta");
  meta.appendChild(el("span", null, "期間: " + d.start + " → " + d.last));
  if (d.commits) meta.appendChild(el("span", null, "commits: " + d.commits));
  if (d.note) meta.appendChild(el("span", null, d.note));
  inner.appendChild(meta);

  detail.appendChild(inner);
  row.appendChild(detail);

  head.addEventListener("click", function () {
    var open = row.classList.toggle("open");
    head.setAttribute("aria-expanded", open ? "true" : "false");
  });

  rowsHost.appendChild(row);
});

/* ── フィルタ ── */
var chips = Array.prototype.slice.call(document.querySelectorAll(".chip"));
chips.forEach(function (chip) {
  chip.addEventListener("click", function () {
    chips.forEach(function (c) { c.setAttribute("aria-pressed", c === chip ? "true" : "false"); });
    var cat = chip.dataset.cat;
    Array.prototype.slice.call(rowsHost.children).forEach(function (row) {
      row.hidden = (cat !== "all" && row.dataset.cat !== cat);
    });
  });
});

/* ── テーマ切替（index.html と同じキーを共有） ── */
(function () {
  var saved = null;
  try { saved = localStorage.getItem("ledger-theme"); } catch (e) {}
  if (saved === "dark" || saved === "light") document.documentElement.dataset.theme = saved;
  document.getElementById("themeToggle").addEventListener("click", function () {
    var cur = document.documentElement.dataset.theme;
    if (!cur) cur = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    var next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("ledger-theme", next); } catch (e) {}
  });
})();
</script>
